name: Extract Project to Root

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract ZIP into repository root
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="StudioAI.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: $ZIP_FILE not found in repository root."
            exit 1
          fi

          mkdir -p extracted_temp
          unzip -o "$ZIP_FILE" -d extracted_temp

          shopt -s dotglob nullglob
          items=(extracted_temp/*)

          if [ ${#items[@]} -eq 0 ]; then
            echo "ERROR: ZIP archive is empty."
            exit 1
          fi

          for item in "${items[@]}"; do
            name="$(basename "$item")"

            if [ "$name" = ".github" ]; then
              mkdir -p .github
              cp -a "$item"/. .github/
            else
              cp -a "$item" .
            fi
          done

          rm -rf extracted_temp

          if [ ! -d app ] || [ ! -f settings.gradle.kts ]; then
            echo "ERROR: Expected Android project files were not found at the root."
            echo "Check whether the ZIP contains an extra enclosing directory."
            exit 1
          fi

          echo "Project files extracted successfully."

      - name: Commit extracted files
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Extract Android project into repository root"
          git push
